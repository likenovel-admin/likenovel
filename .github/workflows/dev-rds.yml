name: Dev RDS on-demand

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Dev RDS action"
        required: true
        type: choice
        default: status
        options:
          - status
          - start
          - stop
          - idle-stop
  schedule:
    # Every 30 minutes. Stops likenovel-dev only after 1 hour with 0 DB connections.
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: dev-rds
  cancel-in-progress: false

jobs:
  dev-rds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run dev RDS action
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          action="${INPUT_ACTION:-status}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            action="idle-stop"
          fi
          bash devtools/dev-rds.sh "$action"
