name: Dev RDS lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: "DEV RDS lifecycle action"
        required: true
        type: choice
        default: status
        options:
          - status
          - work-start
          - down

permissions:
  contents: read

concurrency:
  group: dev-rds-lifecycle
  cancel-in-progress: false

jobs:
  dev-rds:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test DEV RDS lifecycle contracts
        run: |
          bash devtools/test-dev-rds.sh
          python3 devtools/test-dev-rds-reconcile.py
          python3 devtools/test-dev-rds-workflow.py

      - name: Prepare existing SSH credentials
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run DEV RDS lifecycle action
        env:
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          action="${INPUT_ACTION:-status}"
          DEV_RDS_SSH_KEY="$HOME/.ssh/deploy_key" bash devtools/dev-rds.sh "$action"
