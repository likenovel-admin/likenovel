name: Build & Push Docker images (prod)

on:
  push:
    branches: ["prod"]
    paths:
      - "service/**"
      - "partner/**"
      - "cms/**"
      - ".github/workflows/docker-prod.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-prod
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test deployment workflow contracts
        run: python3 devtools/test-web-deploy-workflows.py

      - name: Test git hooks
        run: bash devtools/test-git-hooks.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install service dependencies
        working-directory: service
        run: corepack yarn install --immutable

      - name: Lint service
        working-directory: service
        run: corepack yarn lint --no-cache

      - name: Test service utilities and contracts
        working-directory: service
        run: corepack yarn test:utils

      - name: Install CMS dependencies
        working-directory: cms
        run: npm ci --no-audit --no-fund

      - name: Test CMS contracts
        working-directory: cms
        run: npm run test:contracts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------------------
      # Build env files (DO NOT COMMIT)
      # ---------------------------------------------------------------------
      - name: Write .env.production (PROD) - service(user web)
        working-directory: service
        env:
          SERVICE_ENV_PROD: ${{ secrets.SERVICE_ENV_PROD }}
        run: |
          set -e
          printf '%s' "$SERVICE_ENV_PROD" | tr -d '\r' > .env.production

      - name: Add Naver site verification (PROD)
        working-directory: service
        env:
          NAVER_SITE_VERIFICATION: ${{ secrets.NAVER_SITE_VERIFICATION }}
        run: |
          set -e
          if [ -n "$NAVER_SITE_VERIFICATION" ]; then
            printf '\nNAVER_SITE_VERIFICATION=%s\n' "$NAVER_SITE_VERIFICATION" >> .env.production
          fi

      - name: Write .env.production (PROD) - partner
        working-directory: partner
        env:
          PARTNER_ENV_PROD: ${{ secrets.PARTNER_ENV_PROD }}
        run: |
          set -e
          printf '%s' "$PARTNER_ENV_PROD" | tr -d '\r' > .env.production

      - name: Write .env.production (PROD) - cms
        working-directory: cms
        env:
          CMS_ENV_PROD: ${{ secrets.CMS_ENV_PROD }}
        run: |
          set -e
          printf '%s' "$CMS_ENV_PROD" | tr -d '\r' > .env.production

      # ---------------------------------------------------------------------
      # Build & Push (prod-latest + prod-${SHA})
      # ---------------------------------------------------------------------
      - name: Build & Push - service(user web)
        id: build-service
        uses: docker/build-push-action@v6
        with:
          context: service
          file: service/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_SERVICE }}:prod-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_SERVICE }}:prod-${{ github.sha }}

      - name: Build & Push - partner
        id: build-partner
        uses: docker/build-push-action@v6
        with:
          context: partner
          file: partner/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_PARTNER }}:prod-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_PARTNER }}:prod-${{ github.sha }}

      - name: Build & Push - cms
        id: build-cms
        uses: docker/build-push-action@v6
        with:
          context: cms
          file: cms/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_CMS }}:prod-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_CMS }}:prod-${{ github.sha }}

      # ---------------------------------------------------------------------
      # Deploy to ln-web (prod containers)
      # ECR login → pull new images → recreate containers
      # ---------------------------------------------------------------------
      - name: Deploy to prod server (ln-web)
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -T ln-admin@ec2-3-34-11-39.ap-northeast-2.compute.amazonaws.com \
            "EXPECTED_SERVICE_DIGEST='${{ steps.build-service.outputs.digest }}' EXPECTED_PARTNER_DIGEST='${{ steps.build-partner.outputs.digest }}' EXPECTED_CMS_DIGEST='${{ steps.build-cms.outputs.digest }}' bash -s" << 'ENDSSH'
            set -euo pipefail
            compose_dir=/home/ln-admin/likenovel/docker-prod

            dump_state() {
              (cd "$compose_dir" && docker compose ps) || true
            }

            wait_for_url() {
              local url="$1"
              local label="$2"
              local attempt
              local status

              for attempt in $(seq 1 30); do
                status="$(curl -sS --max-time 5 --output /dev/null --write-out '%{http_code}' "$url" || true)"
                if [[ "$status" == 2* ]]; then
                  echo "[health] $label ready"
                  return 0
                fi
                sleep 2
              done

              echo "[health] $label failed: $url" >&2
              return 1
            }

            verify_service_digest() {
              local compose_dir="$1"
              local service_name="$2"
              local expected_digest="$3"
              local container_id
              local image_id
              local repo_digests

              if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "[image] invalid expected digest for $service_name: $expected_digest" >&2
                return 1
              fi

              container_id="$(cd "$compose_dir" && docker compose ps -q "$service_name")"
              if [[ ! "$container_id" =~ ^[0-9a-f]+$ ]]; then
                echo "[image] expected one running container for $service_name" >&2
                return 1
              fi

              image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
              repo_digests="$(docker image inspect "$image_id" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
              if ! grep -F "@$expected_digest" <<< "$repo_digests" >/dev/null; then
                echo "[image] $service_name is not running expected digest $expected_digest" >&2
                echo "$repo_digests" >&2
                return 1
              fi
              echo "[image] $service_name running expected digest $expected_digest"
            }

            trap dump_state ERR
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 992382709044.dkr.ecr.ap-northeast-2.amazonaws.com
            cd "$compose_dir"
            docker compose pull
            docker compose up -d --remove-orphans

            verify_service_digest "$compose_dir" likenovel-user "$EXPECTED_SERVICE_DIGEST"
            verify_service_digest "$compose_dir" likenovel-partner "$EXPECTED_PARTNER_DIGEST"
            verify_service_digest "$compose_dir" likenovel-admin "$EXPECTED_CMS_DIGEST"
            wait_for_url http://127.0.0.1:3000/ service-prod
            wait_for_url http://127.0.0.1:3001/ partner-prod
            wait_for_url http://127.0.0.1:3002/ cms-prod
            trap - ERR
          ENDSSH

      - name: Verify public prod endpoints
        run: |
          set -euo pipefail
          wait_for_url() {
            local url="$1"
            local attempt
            local status

            for attempt in $(seq 1 30); do
              status="$(curl -sS --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$status" == 2* ]]; then
                echo "[health] ready: $url"
                return 0
              fi
              sleep 2
            done

            echo "[health] failed: $url" >&2
            return 1
          }

          wait_for_url https://www.likenovel.net
          wait_for_url https://partner.likenovel.net
          wait_for_url https://cms.likenovel.net
