name: Build & Push Docker images (dev)

on:
  push:
    branches: ["dev"]
    paths:
      - "service/**"
      - "partner/**"
      - "cms/**"
      - ".github/workflows/docker-dev.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------------------
      # Build env files (DO NOT COMMIT)
      # - Next.js는 빌드 시점에 NEXT_PUBLIC_* 가 번들에 포함될 수 있으므로,
      #   dev/prod 별 빌드가 필요합니다.
      # ---------------------------------------------------------------------
      - name: Write .env.production (DEV) - service(user web)
        working-directory: service
        run: |
          set -e
          printf '%s' "${{ secrets.SERVICE_ENV_DEV }}" | tr -d '\r' > .env.production

      - name: Write .env.production (DEV) - partner
        working-directory: partner
        run: |
          set -e
          printf '%s' "${{ secrets.PARTNER_ENV_DEV }}" | tr -d '\r' > .env.production

      - name: Write .env.production (DEV) - cms
        working-directory: cms
        run: |
          set -e
          printf '%s' "${{ secrets.CMS_ENV_DEV }}" | tr -d '\r' > .env.production

      # ---------------------------------------------------------------------
      # Build & Push (dev-latest + dev-${SHA})
      # ---------------------------------------------------------------------
      - name: Build & Push - service(user web)
        uses: docker/build-push-action@v6
        with:
          context: service
          file: service/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_SERVICE }}:dev-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_SERVICE }}:dev-${{ github.sha }}

      - name: Build & Push - partner
        uses: docker/build-push-action@v6
        with:
          context: partner
          file: partner/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_PARTNER }}:dev-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_PARTNER }}:dev-${{ github.sha }}

      - name: Build & Push - cms
        uses: docker/build-push-action@v6
        with:
          context: cms
          file: cms/Dockerfile
          push: true
          build-args: |
            ENV_FILE=.env.production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_CMS }}:dev-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_CMS }}:dev-${{ github.sha }}

      # ---------------------------------------------------------------------
      # Deploy to ln-web (dev containers)
      # ECR login → pull new images → recreate containers
      # ---------------------------------------------------------------------
      - name: Deploy to dev server (ln-web)
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -T ln-admin@ec2-3-34-11-39.ap-northeast-2.compute.amazonaws.com << 'ENDSSH'
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 992382709044.dkr.ecr.ap-northeast-2.amazonaws.com
            cd /home/ln-admin/likenovel/service-dev/docker && docker compose pull && docker compose up -d --force-recreate
            cd /home/ln-admin/likenovel/partner-dev/docker && docker compose pull && docker compose up -d --force-recreate
            cd /home/ln-admin/likenovel/cms-dev/docker && docker compose pull && docker compose up -d --force-recreate
          ENDSSH
