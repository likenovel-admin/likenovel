version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules # 호스트의 node_modules 덮어쓰지 않도록
    container_name: likenovel-cms
    environment:
      - NODE_ENV=development
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.50"