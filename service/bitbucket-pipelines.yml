image: atlassian/default-image:3

options:
  size: 2x

definitions:
  services:
    docker:
      memory: 5192

pipelines:
  branches:
    production:
      - step:
          runs-on:
            - self.hosted
            - linux
          size: 4x
          name: Build and Push Production Image
          script:
            - echo "Docker Build and Push for Production"
            - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            - docker build --no-cache --rm -f Dockerfile --build-arg ENV_FILE=.env.production -t aiaracorp1/likenovel-user:production .
            - docker push aiaracorp1/likenovel-user:production
          services:
            - docker
          caches:
            - docker
          when: on_success

      - step:
          runs-on:
            - self.hosted
            - linux
          name: Deploy to Production Server
          deployment: Production
          script:
            - echo -e "$LIVE_PEM" | base64 -d > live.pem
            - chmod 400 live.pem
            - ssh-keyscan $LIVE_IP >> ~/.ssh/known_hosts
            - scp -i live.pem prod.docker-compose.yml $LIVE_USER@$LIVE_IP:~/likenovel/service/docker/docker-compose.yml
            - ssh -i live.pem $LIVE_USER@$LIVE_IP "cd ~/likenovel/service/docker && docker compose pull && docker compose up -d"
            - echo 'DONE DEPLOY PRODUCTION'
          services:
            - docker
          when: on_success

    main:
      - step:
          runs-on:
            - self.hosted
            - linux
          size: 4x
          name: Build and Test
          script:
            - echo "Docker Build and Push"
            - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            - docker build --no-cache --rm -f Dockerfile -t aiaracorp1/likenovel-user:latest .
            - docker push aiaracorp1/likenovel-user:latest
          services:
            - docker
          caches:
            - docker
          when: on_success

      - step:
          runs-on:
            - self.hosted
            - linux
          name: Deploy to Production
          deployment: Production
          script:
            - echo "$FREEZER_PEM" | base64 -d > freezer.pem
            - chmod 400 freezer.pem
            - ssh-keyscan -p "$FREEZER_K8S_MASTER_PORT" "$FREEZER_K8S_MASTER_IP" >> ~/.ssh/known_hosts
            - scp -P "$FREEZER_K8S_MASTER_PORT" -i freezer.pem -r ./kubernetes/* "$FREEZER_K8S_MASTER_USER@$FREEZER_K8S_MASTER_IP:~/services/likenovel/user"
            - ssh -p "$FREEZER_K8S_MASTER_PORT" -i freezer.pem "$FREEZER_K8S_MASTER_USER@$FREEZER_K8S_MASTER_IP" "sh -f services/likenovel/user/likenovel-user.sh"
            - echo 'DONE DEPLOY LIVE'
          services:
            - docker
          when: on_success
